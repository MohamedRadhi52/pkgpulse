[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgpulse"
version = "0.1.0"
description = "Plateforme data quotidienne et prévision de la demande sur les téléchargements de crates.io"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Avertissement interne à pandas 2.3 avec NumPy 2.5, sans effet sur les résultats.
filterwarnings = [
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
