name: Déploiement de l'API

# Après chaque exécution réussie du workflow Terraform, donc après chaque push sur main : image
# construite, poussée dans Artifact Registry, déployée sur Cloud Run, puis vérifiée.
on:
  workflow_run:
    workflows: [Terraform]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: us-central1
  SERVICE: pkgpulse-api
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Image
        run: |
          image="$REGION-docker.pkg.dev/$PROJECT_ID/pkgpulse/api:$(git rev-parse --short HEAD)"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Déploiement sur Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" \
            --service-account "pkgpulse-api@$PROJECT_ID.iam.gserviceaccount.com" \
            --set-env-vars "PKGPULSE_DATA_URL=gs://$PROJECT_ID-pkgpulse/export" \
            --allow-unauthenticated --min-instances 0 --max-instances 1 --memory 512Mi --quiet

      - name: Vérification de l'URL publique
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          # Réponse jetée : sans retour à la ligne, elle masquerait l'annotation qui suit.
          curl -fsS --retry 5 --retry-all-errors -o /dev/null "$url/health"
          status=$(curl -s -o /dev/null -w '%{http_code}' "$url/forecast")
          echo "::notice title=API::$url (GET /forecast : HTTP $status)"
