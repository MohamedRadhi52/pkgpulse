name: Pipeline quotidien

# Ingestion réelle depuis static.crates.io puis dbt. Les données (couche bronze, entrepôt DuckDB
# et son snapshot) sont conservées d'une exécution à l'autre dans le cache d'Actions : seuls les
# jours nouveaux ou corrigés sont réécrits.
on:
  push:
    branches: [main]
    paths:
      - "src/pkgpulse/**"
      - "dbt/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DBT_USE_COLORS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: make install

      - name: Restaurer les données
        uses: actions/cache/restore@v6
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Ingestion bronze
        run: make ingest 2>&1 | tee ingest.log

      - name: dbt (fraîcheur, modèles, tests, snapshot)
        run: make dbt 2>&1 | tee dbt.log

      # Les écritures sont atomiques : même après un échec, l'état est cohérent et la prochaine
      # exécution reprend là où celle-ci s'est arrêtée.
      - name: Sauvegarder les données
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: data-${{ github.run_id }}

      - name: Bilan
        if: always()
        run: |
          grep -hs -e "Bilan" -e "Done. PASS" ingest.log dbt.log \
            | sed 's/^[0-9: ,-]*/::notice title=Bilan::/' || true
          if grep -qs "Traceback" ingest.log; then
            echo "::error title=Ingestion::$(tail -n 3 ingest.log | tr '\n' ' ')"
          fi
          if grep -qs -e "Failure in" -e "Error in" dbt.log; then
            echo "::error title=dbt::$(grep -hs -e 'Failure in' -e 'Error in' dbt.log | head -n 5 | tr '\n' ' ')"
          fi
