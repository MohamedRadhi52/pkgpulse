name: Pipeline quotidien

# Ingestion réelle depuis static.crates.io, dbt, backtest et prévision, puis publication des
# agrégats et des prévisions dans la release gold. Les données (couche bronze, entrepôt DuckDB et son snapshot) sont conservées d'une
# exécution à l'autre dans le cache d'Actions : seuls les jours nouveaux ou corrigés sont réécrits.
on:
  schedule:
    - cron: "17 5 * * *"  # le dump de crates.io est pris vers 2 h UTC
  push:
    branches: [main]
    paths:
      - "src/pkgpulse/**"
      - "dbt/**"
      - "requirements.txt"
      - ".github/workflows/daily.yml"
  workflow_dispatch:

permissions:
  contents: write  # mise à jour des fichiers de la release gold

concurrency:
  group: daily
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DBT_USE_COLORS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: make install

      - name: Restaurer les données
        uses: actions/cache/restore@v6
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      # Une relance après une pause absorbe les erreurs passagères (HTTP 500 le 2026-09-30) ; elle
      # est sûre car l'ingestion est idempotente et reprend au premier jour manquant.
      - name: Ingestion bronze
        id: ingest
        run: |
          make ingest 2>&1 | tee ingest.log || { sleep 300; make ingest 2>&1 | tee -a ingest.log; }

      - name: dbt (fraîcheur, modèles, tests, snapshot)
        run: make dbt 2>&1 | tee dbt.log

      - name: Export des agrégats gold
        run: make publish

      - name: Backtest et prévision
        run: make backtest forecast 2>&1 | tee forecast.log

      - name: Publication dans la release gold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view gold > /dev/null 2>&1 || gh release create gold \
            --title "Agrégats quotidiens" \
            --notes "Téléchargements quotidiens de crates.io agrégés (total, catégories, paquets suivis), prévisions et résultats du backtest, mis à jour par le pipeline quotidien. Source : dumps publics de crates.io."
          gh release upload gold data/export/*.csv --clobber

      # Les écritures sont atomiques : même après un échec, l'état est cohérent et la prochaine
      # exécution reprend là où celle-ci s'est arrêtée.
      - name: Sauvegarder les données
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          key: data-${{ github.run_id }}

      - name: Bilan
        if: always()
        run: |
          grep -hs -e "Bilan" -e "Done. PASS" ingest.log dbt.log forecast.log \
            | sed 's/^[0-9: ,-]*/::notice title=Bilan::/' || true
          if [ "${{ steps.ingest.outcome }}" = failure ]; then
            echo "::error title=Ingestion::$(tail -n 3 ingest.log | tr '\n' ' ')"
          elif grep -qs "Traceback" ingest.log; then
            echo "::warning title=Ingestion::réussie après une relance automatique"
          fi
          if grep -qs -e "Failure in" -e "Error in" dbt.log; then
            echo "::error title=dbt::$(grep -hs -e 'Failure in' -e 'Error in' dbt.log | head -n 5 | tr '\n' ' ')"
          fi
